<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Tayyab Ismail — Senior Data and AI Engineer">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6ff00" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c45d3a" stop-opacity="0.10"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1a1a1a" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" fill="#f4f1eb"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <circle cx="1130" cy="90" r="260" fill="url(#glow)"/>

  <!-- eyebrow pill -->
  <rect x="80" y="72" width="228" height="30" rx="8" fill="#b6ff00"/>
  <text x="94" y="92" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="13" font-weight="600" letter-spacing="1.6" fill="#0a0a0a">SENIOR DATA &amp; AI ENGINEER</text>

  <!-- headline -->
  <text x="80" y="184" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="66" font-weight="700" letter-spacing="-2" fill="#1a1a1a">Tayyab Ismail</text>
  <text x="80" y="252" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="30" font-weight="400" letter-spacing="-0.6" fill="#4a4a4a">I don't talk about AI. <tspan font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="34" fill="#c45d3a">I build with it.</tspan></text>

  <!-- rule -->
  <rect x="80" y="292" width="1120" height="1" fill="#1a1a1a" fill-opacity="0.12"/>

  <!-- stat row -->
  <g font-family="ui-monospace, 'IBM Plex Mono', monospace">
    <text x="80"  y="336" font-size="30" font-weight="700" fill="#1a1a1a">30+</text>
    <text x="80"  y="360" font-size="11" letter-spacing="1.5" fill="#8a8a8a">AI SYSTEMS DEPLOYED</text>

    <text x="360" y="336" font-size="30" font-weight="700" fill="#1a1a1a">12+</text>
    <text x="360" y="360" font-size="11" letter-spacing="1.5" fill="#8a8a8a">INDUSTRIES SERVED</text>

    <text x="620" y="336" font-size="30" font-weight="700" fill="#1a1a1a">5&#215;</text>
    <text x="620" y="360" font-size="11" letter-spacing="1.5" fill="#8a8a8a">AVG. ROI PER PROJECT</text>

    <text x="900" y="336" font-size="30" font-weight="700" fill="#1a1a1a">6</text>
    <text x="900" y="360" font-size="11" letter-spacing="1.5" fill="#8a8a8a">COUNTRIES SERVED</text>
  </g>

  <!-- accent bar -->
  <rect x="0" y="410" width="1280" height="10" fill="#b6ff00"/>
</svg>
